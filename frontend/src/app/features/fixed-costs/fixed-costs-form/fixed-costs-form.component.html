<h2 mat-dialog-title>Neue Fixkosten anlegen</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="form-grid">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" placeholder="z.B. Miete, Netflix">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Betrag (€)</mat-label>
      <input matInput type="number" formControlName="amount" min="0.01" step="0.01">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Intervall</mat-label>
      <mat-select formControlName="intervalUnit">
        @for (unit of intervalUnits; track unit.value) {
          <mat-option [value]="unit.value">{{ unit.label }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Alle X (1 = jeden Monat, 3 = Quartal)</mat-label>
      <input matInput type="number" formControlName="intervalValue" min="1">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Startdatum</mat-label>
      <input matInput [matDatepicker]="picker" formControlName="startDate">
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Beschreibung (optional)</mat-label>
      <input matInput formControlName="description">
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Abbrechen</button>
  <button mat-raised-button color="primary" (click)="save()" [disabled]="form.invalid">
    Speichern
  </button>
</mat-dialog-actions>
